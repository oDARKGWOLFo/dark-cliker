<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master of Intuition</title>
    <style>
        /* Премиальный ультра-черный фон с золотыми элементами */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000; /* Глубокий черный фон */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Верхняя панель состояния с золотой неоновой рамкой */
        .header-panel {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 400px;
            background-color: #0d0d0d;
            padding: 14px 20px;
            border-radius: 16px;
            border: 2px solid #ffd700; /* Золотая рамка */
            margin-top: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
        }

        .score-text {
            color: #ffd700; /* Премиальный золотой цвет текста */
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .energy-text {
            color: #ffd700; 
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Главная интерактивная игровая зона */
        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        /* Файл CSS Графическая рубашка карты в золотом оформлении с узором */
        .card-shirt {
            width: 160px;
            height: 240px;
            background-color: #111111;
            border: 3px solid #ffd700; /* Золотая рамка карты */
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
            margin-bottom: 25px;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
            
            /* Сложный золотой графический узор рубашки */
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 10%, rgba(255,215,0,0.05) 11%, transparent 12%),
                linear-gradient(45deg, transparent 48%, #ffd700 49%, #ffd700 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #ffd700 49%, #ffd700 51%, transparent 52%);
            background-size: 20px 20px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 0 0;
        }

        /* Эффект перевернутой карты (лицевая сторона) */
        .card-shirt.flipped {
            background-color: #ffffff !important;
            background-image: none !important;
            transform: rotateY(180deg);
        }

        /* Контент внутри открытой карты */
        .card-front-content {
            font-size: 44px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotateY(180deg); /* Компенсация зеркальности при перевороте */
        }

        .magic-ball {
            font-size: 45px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        /* Текст вопроса/подсказки */
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .screen-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Сетки для кнопок выбора */
        .grid-ranks {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .grid-suits {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        /* Стиль кнопок меню */
        button {
            background-color: #0a0a0a;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 15px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: background-color 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
            background-color: #1a1a1a;
        }

        /* Текст и границы для кнопок мастей */
        .suit-btn[data-color="red"] {
            color: #ff4d4d;
            border-color: #ff4d4d;
        }
        .suit-btn[data-color="black"] {
            color: #ffffff;
            border-color: #ffffff;
        }

        /* Премиальная пульсирующая кнопка видео */
        .video-btn {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            margin-bottom: 35px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            animation: pulseAd 1.5s infinite;
        }

        @keyframes pulseAd {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 15px; border: 2px solid #ffcc00; border-radius: 15px; box-shadow: 0 0 10px #ffcc00; margin: 45px 15px 25px 15px; box-sizing: border-box; background: #000;">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        const ranks = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
        const suits = ['♠', '♣', '♦', '♥'];

        let score = 0;
        let energy = 3;
        const maxEnergy = 3;

        let selectedRank = null;
        let secretCard = null;
        let isAnimating = false;
        let lastEnergyTime = Date.now(); // Время последнего изменения энергии
const RECOVERY_TIME = 60 * 60 * 1000; // Время восстановления (60 минут в миллисекундах)
        
        // Функция переключения режимов игры из Главного меню
function selectGameMode(mode) {
    if (mode === 'training') {
        document.getElementById('main-menu-screen').style.setProperty('display', 'none', 'important');
        document.getElementById('training-room-screen').style.setProperty('display', 'block', 'important');
        document.getElementById('training-room-screen').classList.remove('hidden');
    } else if (mode === 'pvp') {
        alert('Режим "Игра 1 на 1" находится в разработке! Скоро добавим выбор ставок.');
    }
}

function goBackToMenu() {
    document.getElementById('training-room-screen').style.setProperty('display', 'none', 'important');
    document.getElementById('main-menu-screen').style.setProperty('display', 'flex', 'important');
        }

        // Инициализация Adsgram
        let AdController = null;
        if (window.Adsgram && typeof window.Adsgram.createAdController === 'function') {
            AdController = window.Adsgram.createAdController({
                blockId: 'YOUR_BLOCK_ID', 
                debug: true 
            });
        }

        function generateSecretCard() {
            const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
            const randomSuit = suits[Math.floor(Math.random() * suits.length)];
            secretCard = { rank: randomRank, suit: randomSuit };
            console.log(`[Интуиция]: Загаданная карта — ${secretCard.rank}${secretCard.suit}`);
        }

        function chooseRank(rank) {
            if (isAnimating) return;
            selectedRank = rank;
            document.getElementById('instruction-title').innerText = `Выбрано: ${rank}. Какая масть?`;
            document.getElementById('rank-screen').classList.add('hidden');
            document.getElementById('suit-screen').classList.remove('hidden');
        }

        function chooseSuit(suit) {
            if (isAnimating) return;
            
            if (energy <= 0) {
                checkEnergyStatus();
                return;
            }

            const cardElement = document.getElementById('main-game-card');
            if (!cardElement) return;

            isAnimating = true;
if (energy === maxEnergy) {
    lastEnergyTime = Date.now(); // Запускаем таймер с нуля только при первой трате
}
energy--;
document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/${maxEnergy}`;

if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
    window.Telegram.WebApp.CloudStorage.setItem('player_energy', energy.toString());
    window.Telegram.WebApp.CloudStorage.setItem('last_energy_time', lastEnergyTime.toString());
}

            const isRed = secretCard.suit === '♦' || secretCard.suit === '♥';
            const cardColor = isRed ? '#ff4d4d' : '#000000';

            // Анимация переворота и показ карты
            cardElement.innerHTML = `
                <div class="card-front-content" style="color: ${cardColor}">
                    <div>${secretCard.rank}</div>
                    <div style="font-size: 55px; margin-top: -5px;">${secretCard.suit}</div>
                </div>
            `;
            cardElement.classList.add('flipped');

            if (selectedRank === secretCard.rank && suit === secretCard.suit) {
                score += 100;
                document.getElementById('score-display').innerText = "Очки: " + score;
                document.getElementById('instruction-title').innerText = "🎉 Блестяще! Вы угадали карту!";
if (window.Telegram && window.Telegram.WebApp.CloudStorage) {
  window.Telegram.WebApp
    .CloudStorage.setItem(
      'player_score', 
      score.toString()
    );
                }                
            } else {
                document.getElementById('instruction-title').innerText = "Мимо! Развивайте шестое чувство";
            }

            document.getElementById('suit-screen').classList.add('hidden');

            setTimeout(() => {
                cardElement.classList.remove('flipped');
                cardElement.innerHTML = `<div class="magic-ball">🔮</div>`;
                
                isAnimating = false;
                generateSecretCard();
                checkEnergyStatus();
            }, 3000);
        }

        function checkEnergyStatus() {
            if (energy <= 0) {
                document.getElementById('instruction-title').innerText = "Энергия закончилась. Посмотрите видео!";
                document.getElementById('rank-screen').classList.add('hidden');
                document.getElementById('suit-screen').classList.add('hidden');
                document.getElementById('video-button').classList.remove('hidden');
            } else {
                resetToFirstScreen();
            }
        }

        // Функция запуска таймера и пассивного восстановления энергии (+1 в час)
function startEnergyTimer() {
    setInterval(() => {
        if (energy >= maxEnergy) {
            document.getElementById('energy-timer').innerText = ""; // Если энергия полная, таймер скрыт
            return;
        }

        const now = Date.now();
        const timePassed = now - lastEnergyTime;

        // Если прошел час или больше, начисляем энергию
        if (timePassed >= RECOVERY_TIME) {
            const recovered = Math.floor(timePassed / RECOVERY_TIME);
            energy = Math.min(maxEnergy, energy + recovered);
            lastEnergyTime = lastEnergyTime + (recovered * RECOVERY_TIME); // Сдвигаем точку отсчета времени
            
            document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/${maxEnergy}`;
            
            // Сохраняем новое состояние энергии и времени в Telegram CloudStorage
            saveEnergyToCloud();
        }

        // Вычисляем, сколько минут и секунд осталось до получения следующей энергии
        const timeRemaining = RECOVERY_TIME - (now - lastEnergyTime);
        if (timeRemaining > 0) {
            const minutes = Math.floor(timeRemaining / 60000);
            const seconds = Math.floor((timeRemaining % 60000) / 1000);
            
            // Форматируем в красивый вид (например: 59:05)
            const displayMin = minutes < 10 ? '0' + minutes : minutes;
            const displaySec = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('energy-timer').innerText = `⏳ До +1: ${displayMin}:${displaySec}`;
        }
    }, 1000); // Таймер обновляется каждую секунду
}

// Вспомогательная функция для сохранения энергии и времени в облако
function saveEnergyToCloud() {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
        window.Telegram.WebApp.CloudStorage.setItem('player_energy', energy.toString());
        window.Telegram.WebApp.CloudStorage.setItem('last_energy_time', lastEnergyTime.toString());
    }
}

        // Функция открытия модального окна и генерации списка Топ-100 Рейтинга
function openRatingModal() {
    const modal = document.getElementById('rating-modal');
    const listContainer = document.getElementById('rating-list');
    listContainer.innerHTML = ""; // Очищаем список перед открытием
    
    // Базовые демо-данные для наполнения списка. 
    // На первое место временно выводим текущего игрока с его реальными очками 'score'
    const demoPlayers = [
        { name: "Вы (Текущий игрок)", score: score },
        { name: "dark_master", score: 2500 },
        { name: "intuition_king", score: 1800 },
        { name: "crypto_cliker", score: 1200 },
        { name: "alex_777", score: 900 },
        { name: "user_4920", score: 400 }
    ];
    
    // Заполняем список дальше до Топ-100 декоративными ботами для красивого теста верстки
    for (let i = demoPlayers.length; i < 100; i++) {
        demoPlayers.push({ name: `player_anonymous_${i}`, score: Math.max(0, 400 - (i * 4)) });
    }

    // Автоматически сортируем всех игроков от большего количества очков к меньшему
    demoPlayers.sort((a, b) => b.score - a.score);

    // Отрисовываем каждую строчку списка лидеров
    demoPlayers.forEach((player, index) => {
        const place = index + 1;
        let badge = `<span style="color: #888; font-weight: bold; width: 25px; display: inline-block; font-family: sans-serif;">${place}.</span>`;
        let rowStyle = "display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px solid #222; color: #fff; font-size: 14px; font-family: sans-serif;";
        
        // Оформляем Топ-1, Топ-2, Топ-3 уникальными значками медалей и золотым свечением
        if (place === 1) {
            badge = `<span style="font-size: 18px; width: 25px; display: inline-block;">🥇</span>`;
            rowStyle += "color: #ffe600; font-weight: bold; text-shadow: 0 0 5px #ffe600;";
        } else if (place === 2) {
            badge = `<span style="font-size: 18px; width: 25px; display: inline-block;">🥈</span>`;
            rowStyle += "color: #cccccc; font-weight: bold;";
        } else if (place === 3) {
            badge = `<span style="font-size: 18px; width: 25px; display: inline-block;">🥉</span>`;
            rowStyle += "color: #cd7f32; font-weight: bold;";
        }

        const playerRow = document.createElement('div');
        playerRow.style = rowStyle;
        playerRow.innerHTML = `
            <div style="display: flex; align-items: center;">
                ${badge}
                <span style="margin-left: 5px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${player.name}</span>
            </div>
            <span style="color: #ffcc00; font-weight: bold;">${player.score}</span>
        `;
        listContainer.appendChild(playerRow);
    });

    modal.style.display = "flex";
}

// Функция закрытия модального окна рейтинга
function closeRatingModal() {
    document.getElementById('rating-modal').style.display = "none";
}

function watchVideoAd() {
    const videoBtn = document.getElementById('video-button');
    videoBtn.disabled = true;
    document.getElementById('instruction-title').innerText = "Загрузка рекламы...";

    if (AdController) {
        AdController.show().then(() => {
            rewardUser();
        }).catch((error) => {
            console.error("Adsgram Error:", error);
            document.getElementById('instruction-title').innerText = "Реклама не загрузилась. Попробуйте еще раз.";
            videoBtn.disabled = false;
        });
    } else {
        setTimeout(rewardUser, 2000);
    }
        }

function rewardUser() {
    const videoBtn = document.getElementById('video-button');
    energy = maxEnergy;
    document.getElementById('energy-display').innerText = `Энергия: ${energy}/${maxEnergy}`;
    
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
        window.Telegram.WebApp.CloudStorage.setItem('player_energy', energy.toString(), function(err, success) {
            if (err) console.error("Ошибка сохранения энергии после рекламы:", err);
        });
    }

    videoBtn.disabled = false;
    videoBtn.classList.add('hidden');
    resetToFirstScreen();
}

        function resetToFirstScreen() {
            selectedRank = null;
            document.getElementById('instruction-title').innerText = "Какое достоинство у карты?";
            document.getElementById('suit-screen').classList.add('hidden');
            document.getElementById('rank-screen').classList.remove('hidden');
        }

// Инициализация Telegram WebApp
if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    document.getElementById('video-button').classList.add('hidden');

    window.Telegram.WebApp.CloudStorage.getItem('player_score', function(err, value) {
        if (!err && value) {
            score = parseInt(value, 10) || 0;
            document.getElementById('score-display').innerText = `ОЧКИ: ${score}`;
        }
        
        window.Telegram.WebApp.CloudStorage.getItem('player_energy', function(errEnergy, valueEnergy) {
            if (!errEnergy && valueEnergy !== null && valueEnergy !== undefined) {
                energy = parseInt(valueEnergy, 10);
            } else {
                energy = maxEnergy;
            }
            
            window.Telegram.WebApp.CloudStorage.getItem('last_energy_time', function(errTime, valueTime) {
                if (!errTime && valueTime) {
                    lastEnergyTime = parseInt(valueTime, 10) || Date.now();
                } else {
                    lastEnergyTime = Date.now();
                }
                
                document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/${maxEnergy}`;
                generateSecretCard();
                checkEnergyStatus();
                startEnergyTimer(); // Запуск таймера восстановления энергии
            });
        });
    });
} else {
    document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/${maxEnergy}`;
    generateSecretCard();
    checkEnergyStatus();
    startEnergyTimer(); // Запуск таймера в обычном браузере
        }
    </script>
</body>
