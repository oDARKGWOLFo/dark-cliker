<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экономический Adsgram Кликер Cloud</title>
    <!-- ПОДКЛЮЧАЕМ TELEGRAM И ADSGRAM SDK -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 15px; }
        .container { max-width: 400px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        #gold { color: #f59e0b; font-size: 42px; font-weight: bold; margin: 10px 0; }
        .income { color: #10b981; font-size: 16px; margin-bottom: 20px; }
        .click-btn { background: #2563eb; color: white; border: none; padding: 20px; border-radius: 50%; width: 130px; height: 130px; font-size: 18px; cursor: pointer; font-weight: bold; margin-bottom: 20px; box-shadow: 0 6px 0 #1d4ed8; }
        .click-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d4ed8; }
        .shop-btn { background: #475569; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 14px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .shop-btn:hover { background: #64748b; }
        .ad-btn { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .reset-btn { background: transparent; color: #ef4444; border: none; font-size: 11px; margin-top: 20px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📈 ЭКОНОМИЧЕСКИЙ КЛИКЕР</h2>
        <div id="gold">0</div>
        <div class="income">Пассивный доход: +<span id="pps">0</span> монеты/сек</div>
        
        <button class="click-btn" onclick="clickGold()">КЛИК!<br><span style="font-size:12px; font-weight:normal;">(+1 за клик)</span></button>
        
        <div style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 15px;">
            <button class="shop-btn" onclick="buyMine()">🏭 Купить Шахту (Цена: <span id="mine-cost">50</span> 💰)<br><span style="font-size:11px; font-weight:normal; color:#cbd5e1;">Дает +1 монету в секунду</span></button>
        </div>

        <div>
            <button class="ad-btn" onclick="showAdsgramVideo()">📺 Рекламный грант (+100 💰 за просмотр)</button>
        </div>

        <button class="reset-btn" onclick="resetGame()">Обнулить весь прогресс</button>
    </div>

    <script>
        // Сообщаем Telegram, что приложение готово к работе
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // Разворачиваем на весь экран телефона
        }

        let gold = 0;
        let pps = 0;
        let mineCost = 50;

        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;

        // ПРОВЕРКА НАЛИЧИЯ ОБЛАКА TELEGRAM
        const isTgCloudAvailable = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage && window.Telegram.WebApp.CloudStorage.getItem;

        // ФУНКЦИЯ ЗАГРУЗКИ ДАННЫХ
        function loadGame() {
            if (isTgCloudAvailable) {
                // Пытаемся загрузить из облака Telegram
                window.Telegram.WebApp.CloudStorage.getItems(['tg_gold', 'tg_pps', 'tg_mineCost'], (err, values) => {
                    if (!err) {
                        gold = parseFloat(values.tg_gold) || 0;
                        pps = parseInt(values.tg_pps) || 0;
                        mineCost = parseInt(values.tg_mineCost) || 50;
                        updateUI();
                    }
                });
            } else {
                // Если запустили на ПК в обычном браузере
                gold = parseFloat(localStorage.getItem('clicker_gold')) || 0;
                pps = parseInt(localStorage.getItem('clicker_pps')) || 0;
                mineCost = parseInt(localStorage.getItem('clicker_mineCost')) || 50;
                updateUI();
            }
        }

        // ФУНКЦИЯ СОХРАНЕНИЯ ДАННЫХ
        function saveGame() {
            if (isTgCloudAvailable) {
                // Сохраняем в облако Telegram (лимит 1024 символа на ключ, у нас гораздо меньше)
                window.Telegram.WebApp.CloudStorage.setItem('tg_gold', gold.toString());
                window.Telegram.WebApp.CloudStorage.setItem('tg_pps', pps.toString());
                window.Telegram.WebApp.CloudStorage.setItem('tg_mineCost', mineCost.toString());
            } else {
                // Резервное сохранение в браузер
                localStorage.setItem('clicker_gold', gold);
                localStorage.setItem('clicker_pps', pps);
                localStorage.setItem('clicker_mineCost', mineCost);
            }
        }

        function updateUI() {
            document.getElementById('gold').innerText = Math.floor(gold);
            document.getElementById('pps').innerText = pps;
            document.getElementById('mine-cost').innerText = mineCost;
        }

        function clickGold() {
            gold += 1;
            updateUI();
            saveGame();
        }

        function buyMine() {
            if (gold >= mineCost) {
                gold -= mineCost;
                pps += 1;
                mineCost = Math.floor(mineCost * 1.5);
                updateUI();
                saveGame();
            } else {
                alert("Недостаточно золота для инвестиций!");
            }
        }

        // Автоначисление пассивного дохода
        setInterval(function() {
            gold += pps;
            updateUI();
        }, 1000);

        // Фоновое автосохранение раз в 4 секунды (чтобы не спамить запросами к серверу TG)
        setInterval(function() {
            saveGame();
        }, 4000);

        function resetGame() {
            if (confirm("Вы уверены, что хотите обнулить игру?")) {
                gold = 0; pps = 0; mineCost = 50;
                updateUI();
                if (isTgCloudAvailable) {
                    window.Telegram.WebApp.CloudStorage.removeItems(['tg_gold', 'tg_pps', 'tg_mineCost']);
                } else {
                    localStorage.clear();
                }
            }
        }

        function showAdsgramVideo() {
            if (!AdController) {
                gold += 100; updateUI(); saveGame();
                alert("Демо-награда: +100 монет!");
                return;
            }
            AdController.show().then(() => {
                gold += 100; updateUI(); saveGame();
            }).catch(() => {
                alert("Досмотрите видео для получения гранта!");
            });
        }

        // Запуск загрузки при старте приложения
        loadGame();
    </script>
</body>
</html>
