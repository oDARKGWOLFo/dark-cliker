<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Clicker Pro</title>
    <!-- Подключаем официальный скрипт Adsgram (критично для рекламы) -->
    <script src="https://adsgram.ai"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1e1e2f, #11111a);
            font-family: 'Arial', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }
        /* Блок баланса */
        .balance-container {
            text-align: center;
            margin-top: 20px;
        }
        .balance-label {
            font-size: 14px;
            color: #8a8a9e;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .balance-value {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            margin-top: 5px;
        }
        .stats {
            font-size: 14px;
            color: #a0a0b8;
            margin-top: 5px;
        }
        /* Главная кнопка-кликер */
        .click-btn {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            border: 8px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
        }
        .click-btn:active {
            transform: scale(0.92);
        }
        /* Блок нижней рекламы и апгрейдов */
        .footer-menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-ui {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: opacity 0.2s;
        }
        .btn-ui:active {
            opacity: 0.8;
        }
        .btn-upgrade {
            background: linear-gradient(90deg, #3498db, #2980b9);
        }
        .btn-ads {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
        }
    </style>
</head>
<body>

    <!-- ВЕРХНИЙ ИНТЕРФЕЙС: БАЛАНС -->
    <div class="balance-container">
        <div class="balance-label">Ваш баланс</div>
        <div id="balance" class="balance-value">0</div>
        <div id="stats" class="stats">За клик: +1</div>
    </div>

    <!-- ЦЕНТР: КНОПКА КЛИКЕРА -->
    <button class="click-btn" id="clicker">🟡</button>

    <!-- НИЖНИЙ ИНТЕРФЕЙС: АПГРЕЙД И МОНЕТИЗАЦИЯ -->
    <div class="footer-menu">
        <!-- Кнопка прокачки клика -->
        <button class="btn-ui btn-upgrade" id="upgrade-btn">Прокачать клик (Цена: 50)</button>
        <!-- Официальная вежливая кнопка рекламы для Adsgram -->
        <button class="btn-ui btn-ads" id="ads-btn">Получить бонус за просмотр</button>
    </div>

    <script>
        // Игровое состояние
        let coins = 0;
        let clickPower = 1;
        let upgradeCost = 50;

        const balanceEl = document.getElementById('balance');
        const statsEl = document.getElementById('stats');
        const clickerEl = document.getElementById('clicker');
        const upgradeBtnEl = document.getElementById('upgrade-btn');
        const adsBtnEl = document.getElementById('ads-btn');

        // Обновление интерфейса
        function updateUI() {
            balanceEl.innerText = Math.floor(coins);
            statsEl.innerText = `За клик: +${clickPower}`;
            upgradeBtnEl.innerText = `Прокачать клик (Цена: ${upgradeCost})`;
            saveGame();
        }

        // Логика клика
        clickerEl.addEventListener('click', () => {
            coins += clickPower;
            updateUI();
        });

        // Логика покупки улучшения
        upgradeBtnEl.addEventListener('click', () => {
            if (coins >= upgradeCost) {
                coins -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.6); // Цена следующего апгрейда растет
                updateUI();
            } else {
                alert("Недостаточно монет для улучшения.");
            }
        });

        // ИНТЕГРАЦИЯ ADSGRAM (Реклама за вознаграждение)
        adsBtnEl.addEventListener('click', () => {
            if (window.Adsgram) {
                // ВАЖНО: Пока проект тестируется, используем тестовый блок "4218". 
                // Как только Adsgram одобрит бота, замени 4218 на свой личный Block ID!
                const AdController = window.Adsgram.init({ blockId: "4218" });
                
                AdController.show().then(() => {
                    // Награда за успешный просмотр (Даем много монет)
                    const bonus = clickPower * 100;
                    coins += bonus;
                    updateUI();
                    alert(`Спасибо за просмотр. Вам зачислен бонус в размере ${bonus} монет.`);
                }).catch((error) => {
                    console.error("Ошибка рекламы:", error);
                    alert("Рекламный ролик не был досмотрен полностью.");
                });
            } else {
                alert("Рекламная сеть временно недоступна. Пожалуйста, попробуйте позже.");
            }
        });

        // Сохранение и загрузка
        function saveGame() {
            const data = { coins, clickPower, upgradeCost };
            localStorage.setItem('fast_clicker_save', JSON.stringify(data));
        }

        function loadGame() {
            const saved = localStorage.getItem('fast_clicker_save');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    coins = data.coins ?? 0;
                    clickPower = data.clickPower ?? 1;
                    upgradeCost = data.upgradeCost ?? 50;
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        // Старт
        loadGame();
    </script>
</body>
</html>
