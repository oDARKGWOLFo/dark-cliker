<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Neon Clicker</title>
    <!-- Идеально связываем с созданной вами папкой стилей -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Подключаем официальные библиотеки Telegram и Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai those-integration-v1.js" async></script>
</head>
<body>

    <!-- Панель баланса игрока -->
    <div class="header-panel">
        <div class="stat-box">
            <div class="stat-label">Монеты</div>
            <div class="stat-value" id="coins">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Алмазы</div>
            <div class="stat-value" id="diamonds">0</div>
        </div>
    </div>

    <!-- Кликабельная монета -->
    <div class="click-area">
        <div class="main-coin" id="coin-trigger">🪙</div>
    </div>

    <!-- Кнопка рекламы Adsgram (добыча алмазов) -->
    <button class="btn btn-ad" id="ad-btn">Получить +1 💎 за видео</button>

    <!-- Магазин прокачки -->
    <div class="shop-panel">
        <div class="shop-title">Магазин улучшений</div>
        <div class="shop-item">
            <div class="item-info">
                <div class="item-name">Мультиклик (Ур. <span id="click-lvl">1</span>)</div>
                <div class="item-desc">Увеличивает базовый клик</div>
            </div>
            <button class="btn" id="buy-click-btn">1 💎</button>
        </div>
    </div>

    <!-- Магия модульности: запускаем главный файл из вашей папки js -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
