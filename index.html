<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эволюция: Вертикальное Древо</title>
    <!-- [ Официальный скрипт рекламной сети Adsgram ] -->
    <script src="https://adsgram.ai"></script>
    <style>
        /* [ ========================================================================== ] */
        /* [ 1. СБРОС СТИЛЕЙ БРАУЗЕРА (ЭКРАН СМАРТФОНА) ] */
        /* [ ========================================================================== ] */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05060c;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* [ ========================================================================== ] */
        /* [ 2. ИГРОВАЯ КАРТА КОСМОСА ] */
        /* [ ========================================================================== ] */
        #game-map {
            position: absolute;
            width: 100%;       
            height: 3000px;    
            left: 0;
            top: -2200px;      
            background: linear-gradient(to top, #0a0b1e 0%, #121435 50%, #1a1c4b 100%);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 350px 350px, 200px 200px;
            background-position: 0 0, 40px 60px;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* [ ========================================================================== ] */
        /* [ 3. СТИЛИ ИНТЕРФЕЙСА ХУД И КНОПОК ] */
        /* [ ========================================================================== ] */
        .top-hud {
            position: absolute;
            top: 20px;
            left: 5%;
            width: 90%;
            background: rgba(13, 16, 37, 0.85);
            border: 2px solid #23295c;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label {
            font-size: 10px;
            color: #8da2fb;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .hud-value {
            font-size: 20px;
            font-weight: bold;
        }
        #dna-balance { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }
        #crystals-val { color: #ff3366; text-shadow: 0 0 10px rgba(255, 51, 102, 0.4); }

        .bottom-hud {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            z-index: 10;
        }

        .btn-ads {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #10b981, #059669);
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* [ ========================================================================== ] */
        /* [ СТИЛИ ИКОНОК И ДРЕВА ЭВОЛЮЦИИ НА КАРТЕ ] */
        /* [ ========================================================================== ] */
        .evo-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            cursor: pointer;
            z-index: 6;
            transition: transform 0.1s ease;
        }
        .evo-node:active {
            transform: scale(0.92);
        }

        .node-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2d4a 0%, #151625 100%);
            border: 3px solid #485296;
            box-shadow: 0 0 20px rgba(72, 82, 150, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 6px;
        }

        .node-title {
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .node-cost {
            font-size: 11px;
            color: #00d2ff;
            margin-top: 2px;
        }

        .evo-line {
            position: absolute;
            background: linear-gradient(to top, #485296, #00d2ff);
            opacity: 0.4;
            box-shadow: 0 0 8px #00d2ff;
            z-index: 4;
        }
    </style>
</head>
    
<body>

    <div id="viewport">
        
        <!-- [ ВЕРХНИЙ ИНТЕРФЕЙС: БАЛАНС ДНК И КРИСТАЛЛОВ ] -->
        <div class="top-hud">
            <div class="hud-item">
                <span class="hud-label">Молекулы ДНК</span>
                <span id="dna-balance" class="hud-value">0</span>
            </div>
            <div class="hud-item" style="width: 2px; height: 30px; background: #23295c;"></div>
            <div class="hud-item">
                <span class="hud-label">Кристаллы</span>
                <span id="crystals-val" class="hud-value">0</span>
            </div>
        </div>

        <!-- ========================================================================== -->
        <!-- [ ИГРОВАЯ КАРТА КОСМОСА С ИНТЕРАКТИВНЫМ ДРЕВОМ ] -->
        <!-- ========================================================================== -->
        <div id="game-map">
            
            <!-- [ Тонкая неоновая линия-связь между ДНК и Аминокислотами ] -->
            <div class="evo-line" style="bottom: 220px; left: 45%; width: 4px; height: 120px; transform: rotate(-30deg);"></div>

            <!-- [ 1. Карточка Эволюции: ДНК (Клик по ней даёт +1 ДНК) ] -->
            <div class="evo-node" id="dna-node-click" style="bottom: 150px; left: 20%;">
                <div class="node-circle" style="border-color: #00d2ff; box-shadow: 0 0 20px rgba(0,210,255,0.4);">🧬</div>
                <span class="node-title">ДНК</span>
                <span class="node-cost">+1 за клик</span>
            </div>

            <!-- [ 2. Карточка Эволюции: Аминокислоты (Покупка даёт +1/сек) ] -->
            <div class="evo-node" id="amino-node-click" style="bottom: 250px; left: 55%;">
                <div class="node-circle" id="amino-icon" style="opacity: 0.6; border-color: #8e44ad;">🧪</div>
                <span class="node-title" id="amino-title">Аминокислоты</span>
                <span class="node-cost" id="amino-cost">Цена: 40 ДНК</span>
            </div>

            <div style="position: absolute; bottom: 80px; left: 0; width: 100%; text-align: center; color: rgba(255,255,255,0.2); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">
                Техническое древо жизни
            </div>

        </div>

        <div class="bottom-hud">
            <!-- [ Кнопка рекламы Adsgram ] -->
            <button class="btn-ads" id="ads-bonus-btn">Получить 1 Кристалл за просмотр</button>
        </div>

    </div>
    
    <!-- ========================================================================== -->
    <!-- [ 4. ПОЛНЫЙ ИСПРАВЛЕННЫЙ СКРИПТ ЛОГИКИ ] -->
    <!-- ========================================================================== -->
    <script>
        const viewport = document.getElementById('viewport');
        const map = document.getElementById('game-map');
        const adsBtn = document.getElementById('ads-bonus-btn');

        // [ Базовые игровые переменные ]
        let dna = 0;
        let crystals = 0;
        let clickPower = 1;
        let autoDnaPerSecond = 0;
        let isAminoBought = false; // [ Проверка: куплены ли аминокислоты ]

        // [ Переменные скролла карты строго вверх/вниз ]
        let isDragging = false;
        let startY = 0;
        let currentY = -2200; 

        // [ Плавное обновление экрана ]
        function updateUI() {
            const dnaBox = document.getElementById('dna-balance');
            const cryBox = document.getElementById('crystals-val');
            if (dnaBox) dnaBox.innerText = Math.floor(dna);
            if (cryBox) cryBox.innerText = crystals;

            // [ Визуальное состояние Аминокислот в зависимости от покупки ]
            const icon = document.getElementById('amino-icon');
            const costText = document.getElementById('amino-cost');
            
            if (isAminoBought) {
                if (icon) {
                    icon.style.opacity = "1";
                    icon.style.borderColor = "#00d2ff";
                    icon.style.boxShadow = "0 0 20px rgba(0,210,255,0.4)";
                }
                if (costText) costText.innerText = "Куплено (+1/с)";
            } else {
                if (icon) {
                    icon.style.opacity = "0.6";
                    icon.style.borderColor = "#8e44ad";
                    icon.style.boxShadow = "none";
                }
                if (costText) costText.innerText = "Цена: 40 ДНК";
            }

            saveGameProgress();
        }

        // [ ФУНКЦИЯ КЛИКА ПО ДНК ]
        function coreClickAction() {
            dna += clickPower;
            updateUI();
        }

        // [ ФУНКЦИЯ ПОКУПКИ АМИНОКИСЛОТ ]
        function buyAminoAcids() {
            if (isAminoBought) {
                alert("Аминокислоты уже успешно открыты!");
                return;
            }

            if (dna >= 40) {
                dna -= 40;
                autoDnaPerSecond += 1; // [ Запускаем пассивный доход ]
                isAminoBought = true;  // [ Переключаем статус на куплено ]
                updateUI();
                alert("Вы успешно открыли Аминокислоты! Теперь ДНК генерируется пассивно.");
            } else {
                alert("Недостаточно молекул ДНК. Нужно 40 ДНК.");
            }
        }

        // [ ПРОСМОТР РЕКЛАМЫ ADSGRAM ]
        function showBonusVideoAd() {
            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: "4218" });
                AdController.show().then(() => {
                    crystals += 1;
                    updateUI();
                    alert("Спасибо за просмотр. Вам зачислен 1 кристалл.");
                }).catch((error) => {
                    alert("Рекламный ролик не был досмотрен полностью.");
                });
            } else {
                alert("Рекламная сеть временно недоступна.");
            }
        }

        // [ Железобетонная привязка кликов по ID после полной загрузки страницы ]
        document.addEventListener("DOMContentLoaded", () => {
            const dnaNode = document.getElementById('dna-node-click');
            if (dnaNode) dnaNode.addEventListener('click', coreClickAction);

            const aminoNode = document.getElementById('amino-node-click');
            if (aminoNode) aminoNode.addEventListener('click', buyAminoAcids);

            if (adsBtn) adsBtn.addEventListener('click', showBonusVideoAd);
        });

        // [ Логика скролла карты вверх/вниз ]
        viewport.addEventListener('touchstart', (e) => {
            isDragging = true;
            startY = e.touches.clientY - currentY;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches.clientY - startY;
            const minY = viewport.clientHeight - 3000;
            const maxY = 0;
            currentY = Math.min(maxY, Math.max(currentY, minY));
            map.style.transform = `translate3d(0px, ${currentY}px, 0px)`;
        }, { passive: true });

        viewport.addEventListener('touchend', () => { isDragging = false; });

        // [ Автоначисление ДНК каждую секунду ]
        setInterval(() => {
            if (autoDnaPerSecond > 0) {
                dna += autoDnaPerSecond;
                const dnaBox = document.getElementById('dna-balance');
                if (dnaBox) dnaBox.innerText = Math.floor(dna);
                saveGameProgress();
            }
        }, 1000);

        // [ Сохранение пакета данных в память телефона ]
        function saveGameProgress() {
            const gameData = { dna, crystals, clickPower, autoDnaPerSecond, isAminoBought };
            localStorage.setItem('evo_vertical_save', JSON.stringify(gameData));
        }

        // [ Загрузка пакета данных при входе ]
        function loadGameProgress() {
            const savedData = localStorage.getItem('evo_vertical_save');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    dna = data.dna ?? 0;
                    crystals = data.crystals ?? 0;
                    clickPower = data.clickPower ?? 1;
                    autoDnaPerSecond = data.autoDnaPerSecond ?? 0;
                    isAminoBought = data.isAminoBought ?? false;
                } catch (e) { console.error(e); }
            }
            updateUI();
        }

        // [ Мгновенный запуск при открытии страницы ]
        loadGameProgress();
    </script>
</body>
</html>
