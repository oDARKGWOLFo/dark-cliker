<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эволюция: Вертикальное Древо</title>
    <!-- Официальный скрипт рекламной сети Adsgram -->
    <script src="https://adsgram.ai"></script>
    <style>
        /* ==========================================================================
           1. СБРОС СТИЛЕЙ БРАУЗЕРА (ЭКРАН СМАРТФОНА)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05060c;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        /* Главное окно телефона, через которое мы видим игру */
        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* ==========================================================================
           2. ИГРОВАЯ КАРТА: КОСМИЧЕСКОЕ ПРОСТРАНСТВО (Движение строго вверх/вниз)
           ========================================================================== */
        #game-map {
            position: absolute;
            width: 100%;       /* Ширина ровно под экран телефона (без скролла влево/вправо) */
            height: 3000px;    /* Карта очень длинная, уходит далеко вверх */
            left: 0;
            top: -2200px;      /* Стартуем в самом низу карты (3000px минус высота экрана) */
            
            /* Космический неоновый фон с эффектом звездной пыли */
            background: linear-gradient(to top, #0a0b1e 0%, #121435 50%, #1a1c4b 100%);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 350px 350px, 200px 200px;
            background-position: 0 0, 40px 60px;
            
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* Инструкция на карте для теста */
        .map-info-text {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           3. ИНТЕРФЕЙС УПРАВЛЕНИЯ: ПАНЕЛИ БАЛАНСА И КНОПКИ (Прибиты к экрану сверху и снизу)
           ========================================================================== */
        /* Верхняя плашка для вывода баланса */
        .top-hud {
            position: absolute;
            top: 20px;
            left: 5%;
            width: 90%;
            background: rgba(13, 16, 37, 0.85);
            border: 2px solid #23295c;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        /* Общий стиль для каждого ресурса в плашке */
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label {
            font-size: 10px;
            color: #8da2fb;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .hud-value {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }
        /* Цвета цифр ресурсов */
        #dna-val { color: #00d2ff; }
        #crystals-val { color: #ff3366; }

        /* Нижняя панель для кнопки рекламы */
        .bottom-hud {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            z-index: 10;
        }

        /* Кнопка рекламы Adsgram */
        .btn-ads {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #10b981, #059669);
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            transition: opacity 0.2s;
        }
        .btn-ads:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="viewport">
        
        <!-- ВЕРХНИЙ ИНТЕРФЕЙС: БАЛАНС ДНК И АЛМАЗОВ (Прибит к экрану) -->
        <div class="top-hud">
            <div class="hud-item">
                <span class="hud-label">Молекулы ДНК</span>
                <span id="dna-val" class="hud-value">0</span>
            </div>
            <div class="hud-item" style="width: 2px; height: 30px; background: #23295c;"></div >
            <div class="hud-item">
                <span class="hud-label">Кристаллы</span>
                <span id="crystals-val" class="hud-value">0</span>
            </div>
        </div>

        <!-- ==========================================================================
             ИГРОВАЯ КАРТА КОСМОСА (Двигается пальцем строго по вертикали)
             ========================================================================== -->
        <div id="game-map">
            <div class="map-info-text">Листайте вверх, чтобы увидеть древо эволюции ↑</div>
            <!-- Сюда в следующих шагах мы будем добавлять сферы жизни и цепочки существ -->
        </div>

        <!-- НИЖНИЙ ИНТЕРФЕЙС: КНОПКА ПОЛУЧЕНИЯ АЛМАЗОВ -->
        <div class="bottom-hud">
            <button class="btn-ads" id="ads-bonus-btn">Получить 1 Кристалл за просмотр</button>
        </div>

    </div>

    <!-- ==========================================================================
         4. РАЗДЕЛ: ЛОГИКА И СКРИПТЫ ДВИЖЕНИЯ И РЕКЛАМЫ
         ========================================================================== -->
    <script>
        // Ссылки на элементы экрана
        const viewport = document.getElementById('viewport');
        const map = document.getElementById('game-map');
        const adsBtn = document.getElementById('ads-bonus-btn');

        // Игровые переменные баланса
        let dna = 0;
        let crystals = 0;

        // Переменные для вертикального скролла карты
        let isDragging = false;
        let startY = 0;
        let currentY = -2200; // Стартовое положение в самом низу карты

        // Обновление цифр на верхней панели
        function updateUI() {
            document.getElementById('dna-val').innerText = Math.floor(dna);
            document.getElementById('crystals-val').innerText = crystals;
            saveGameProgress();
        }

        // --- ЛОГИКА ВЕРТИКАЛЬНОГО СКРОЛЛА (Строго вверх и вниз) ---
        viewport.addEventListener('touchstart', (e) => {
            isDragging = true;
            // Нам важна только координата Y (вверх/вниз), координату X (влево/вправо) мы игнорируем
            startY = e.touches[0].clientY - currentY;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            // Вычисляем новое положение карты по вертикали
            currentY = e.touches[0].clientY - startY;

            // Рассчитываем жесткие лимиты, чтобы карта не улетала в пустоту сверху и снизу
            const minY = viewport.clientHeight - 3000; // Самый верхний край карты (ограничение)
            const maxY = 0;                            // Самый нижний край карты (ограничение)

            // Удерживаем карту в границах
            currentY = Math.min(maxY, Math.max(currentY, minY));

            // Сдвигаем карту. Обрати внимание: меняется только координата Y, по оси X всегда стоит 0!
            map.style.transform = `translate3d(0px, ${currentY}px, 0px)`;
        }, { passive: true });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
        });


        // --- ИНТЕГРАЦИЯ ADSGRAM: НАЧИСЛЕНИЕ АЛМАЗОВ ---
        adsBtn.addEventListener('click', () => {
            if (window.Adsgram) {
                // Во время тестов используем официальный блок "4218"
                const AdController = window.Adsgram.init({ blockId: "4218" });
                
                AdController.show().then(() => {
                    // Реклама досмотрена успешно: начисляем 1 алмаз
                    crystals += 1;
                    updateUI();
                    alert("Спасибо за просмотр. Вам зачислен 1 кристалл.");
                }).catch((error) => {
                    console.error("Ошибка рекламы:", error);
                    alert("Рекламный ролик не был досмотрен полностью.");
                });
            } else {
                alert("Рекламная сеть временно недоступна. Пожалуйста, проверьте подключение к интернету.");
            }
        });


// --- СОХРАНЕНИЕ И ЗАГРУЗКА ДАННЫХ В ТЕЛЕФОН ---
        function saveGameProgress() {
            // Собираем текущий баланс ДНК и кристаллов в один пакет данных
            const gameData = { 
                dna: dna, 
                crystals: crystals 
            };
            // Записываем этот пакет в постоянную память браузера телефона
            localStorage.setItem('evo_vertical_save', JSON.stringify(gameData));
        }

        function loadGameProgress() {
            // Пытаемся достать сохраненный пакет данных из памяти телефона
            const savedData = localStorage.getItem('evo_vertical_save');
            
            // Если сохранение существует — распаковываем его и зачисляем игроку
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    dna = data.dna ?? 0;
                    crystals = data.crystals ?? 0;
                } catch (e) { 
                    // Если файл сохранения поврежден, выводим ошибку в консоль
                    console.error("Ошибка чтения памяти сохранения:", e); 
                }
            }
            // Перерисовываем цифры на верхней панели экрана
            updateUI();
        }

        // Самая последняя строчка в коде, которая запускает чтение памяти при старте игры
        loadGameProgress();        

</script>
</body>
</html>
