<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master of Intuition</title>
    <style>
        /* Премиальный ультра-черный фон с золотыми элементами */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000; /* Глубокий черный фон */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Верхняя панель состояния с золотой неоновой рамкой */
        .header-panel {
            display: flex;
            justify-content: center;
            flex-direction: column;
            width: 60%;
            max-width: 400px;
            background-color: #0d0d0d;
            padding: 14px 20px;
            border-radius: 16px;
            border: 2px solid #ffd700; /* Золотая рамка */
            margin-top: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
        }

        .energy-text {
            color: #ffd700; 
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .timer-text {
    font-size: 14px;
    color: #ffd700;
    margin-top: 5px;
    font-family: sans-serif;
    font-weight: bold;
        }
        
        .timer-text {
    font-size: 14px;
    color: #ffd700;
    margin-top: 5px;
    font-family: sans-serif;
    font-weight: bold;
        }

        /* Главная интерактивная игровая зона */
        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        /* Файл CSS Графическая рубашка карты в золотом оформлении с узором */
        .card-shirt {
            width: 160px;
            height: 240px;
            background-color: #111111;
            border: 3px solid #ffd700; /* Золотая рамка карты */
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
            margin-bottom: 25px;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
            
            /* Сложный золотой графический узор рубашки */
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 10%, rgba(255,215,0,0.05) 11%, transparent 12%),
                linear-gradient(45deg, transparent 48%, #ffd700 49%, #ffd700 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #ffd700 49%, #ffd700 51%, transparent 52%);
            background-size: 20px 20px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 0 0;
        }

        /* Эффект перевернутой карты (лицевая сторона) */
        .card-shirt.flipped {
            background-color: #ffffff !important;
            background-image: none !important;
            transform: rotateY(180deg);
        }

        /* Контент внутри открытой карты */
        .card-front-content {
            font-size: 44px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotateY(180deg); /* Компенсация зеркальности при перевороте */
        }

        .magic-ball {
            font-size: 45px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        /* Текст вопроса/подсказки */
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .screen-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Сетки для кнопок выбора */
        .grid-ranks {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .grid-suits {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        /* Стиль кнопок меню */
        button {
            background-color: #0a0a0a;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 15px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: background-color 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
            background-color: #1a1a1a;
        }

        /* Текст и границы для кнопок мастей */
        .suit-btn[data-color="red"] {
            color: #ff4d4d;
            border-color: #ff4d4d;
        }
        .suit-btn[data-color="black"] {
            color: #ffffff;
            border-color: #ffffff;
        }

        /* Премиальная пульсирующая кнопка видео */
        .video-btn {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            margin-bottom: 35px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            animation: pulseAd 1.5s infinite;
        }

        @keyframes pulseAd {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Шапка с игровыми данными -->
    <div class="header-panel">
        <div class="energy-text" id="energy-display">Энергия: 3/3</div>
        <div class="timer-text" id="energy-timer">⏳ до +1: 60:00</div>
    </div>

    <!-- Игровой стол -->
    <div class="game-zone">
        <!-- Интерактивная карта с узором рубашки -->
<div class="card-shirt" id="main-game-card">
            <div class="magic-ball">🔮</div>
        </div>
        
        <!-- Интерактивный заголовок-инструкция -->
        <div class="question-text" id="instruction-title">Какое достоинство у карты?</div>

        <!-- ШАГ 1: Меню выбора достоинства (6-Туз) -->
        <div id="rank-screen" class="screen-container">
            <div class="grid-ranks">
                <button onclick="chooseRank('6')">6</button>
                <button onclick="chooseRank('7')">7</button>
                <button onclick="chooseRank('8')">8</button>
                <button onclick="chooseRank('9')">9</button>
                <button onclick="chooseRank('10')">10</button>
                <button onclick="chooseRank('J')">J</button>
                <button onclick="chooseRank('Q')">Q</button>
                <button onclick="chooseRank('K')">K</button>
                <button onclick="chooseRank('A')">A</button>
            </div>
        </div>

        <!-- ШАГ 2: Меню выбора масти (изначально скрыто) -->
        <div id="suit-screen" class="screen-container hidden">
            <div class="grid-suits">
                <button class="suit-btn" data-color="black" onclick="chooseSuit('♠')">Пики ♠</button>
                <button class="suit-btn" data-color="black" onclick="chooseSuit('♣')">Крести ♣</button>
                <button class="suit-btn" data-color="red" onclick="chooseSuit('♦')">Буби ♦</button>
                <button class="suit-btn" data-color="red" onclick="chooseSuit('♥')">Черви ♥</button>
            </div>
        </div>

        <!-- Кнопка видеорекламы для восполнения попыток -->
        <button id="video-button" class="video-btn hidden" onclick="watchVideoAd()">🎬 Посмотреть видео (+3 Энергии)</button>
    </div>
<!-- Подключаем Adsgram SDK -->
    <script src="https://static.adsgram.ai/js/advadsgram-sdk.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        const ranks = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
        const suits = ['♠', '♣', '♦', '♥'];

        let energy = 3;
        const maxEnergy = 3;

        let selectedRank = null;
        let secretCard = null;
        let isAnimating = false;

        // Инициализация Adsgram
        let AdController = null;
        if (window.Adsgram && typeof window.Adsgram.createAdController === 'function') {
            AdController = window.Adsgram.createAdController({
                blockId: 'YOUR_BLOCK_ID', 
                debug: true 
            });
        }

        function generateSecretCard() {
            const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
            const randomSuit = suits[Math.floor(Math.random() * suits.length)];
            secretCard = { rank: randomRank, suit: randomSuit };
            console.log(`[Интуиция]: Загаданная карта — ${secretCard.rank}${secretCard.suit}`);
        }

        function chooseRank(rank) {
            if (isAnimating) return;
            selectedRank = rank;
            document.getElementById('instruction-title').innerText = `Выбрано: ${rank}. Какая масть?`;
            document.getElementById('rank-screen').classList.add('hidden');
            document.getElementById('suit-screen').classList.remove('hidden');
        }

        function chooseSuit(suit) {
            if (isAnimating) return;
            
            if (energy <= 0) {
                checkEnergyStatus();
                return;
            }

            const cardElement = document.getElementById('main-game-card');
            if (!cardElement) return;

            isAnimating = true;
            energy--;
            document.getElementById('energy-display').innerText = `Энергия: ${energy}/${maxEnergy}`;
            if (window.Telegram && window.Telegram.WebApp.CloudStorage) {
    window.Telegram.WebApp.CloudStorage.setItem('player_energy', energy.toString());
                }

            const isRed = secretCard.suit === '♦' || secretCard.suit === '♥';
            const cardColor = isRed ? '#ff4d4d' : '#000000';

            // Анимация переворота и показ карты
            cardElement.innerHTML = `
                <div class="card-front-content" style="color: ${cardColor}">
                    <div>${secretCard.rank}</div>
                    <div style="font-size: 55px; margin-top: -5px;">${secretCard.suit}</div>
                </div>`;
            cardElement.classList.add('flipped');

            if (selectedRank === secretCard.rank && suit === secretCard.suit) {
                document.getElementById('instruction-title').innerText = "🎉 Блестяще! Вы угадали карту!";                
            } else {
                document.getElementById('instruction-title').innerText = "Мимо! Развивайте шестое чувство";
            }

            document.getElementById('suit-screen').classList.add('hidden');

            setTimeout(() => {
                cardElement.classList.remove('flipped');
                cardElement.innerHTML = `<div class="magic-ball">🔮</div>`;
                
                isAnimating = false;
                generateSecretCard();
                checkEnergyStatus();
            }, 3000);
        }

        function checkEnergyStatus() {
            if (energy <= 0) {
                document.getElementById('instruction-title').innerText = "Энергия закончилась. Посмотрите видео!";
                document.getElementById('rank-screen').classList.add('hidden');
                document.getElementById('suit-screen').classList.add('hidden');
                document.getElementById('video-button').classList.remove('hidden');
            } else {
                resetToFirstScreen();
            }
        }

        function watchVideoAd() {
            const videoBtn = document.getElementById('video-button');
            videoBtn.disabled = true;
            document.getElementById('instruction-title').innerText = "Загрузка рекламы...";

            if (AdController && AdController.blockId !== 'YOUR_BLOCK_ID') {
                AdController.show().then(() => {
                    rewardUser();
                }).catch((error) => {
                    console.error("Adsgram Error:", error);
                    document.getElementById('instruction-title').innerText = "Ошибка рекламы. Энергия восстановлена.";
                    setTimeout(rewardUser, 2000); 
                });
            } else {
                setTimeout(rewardUser, 3000);
            }
        }

        function rewardUser() {
            const videoBtn = document.getElementById('video-button');
            energy = maxEnergy;
            document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/3`;
            videoBtn.disabled = false;
            videoBtn.classList.add('hidden');
            resetToFirstScreen();
        }

        function resetToFirstScreen() {
            selectedRank = null;
            document.getElementById('instruction-title').innerText = "Какое достоинство у карты?";
            document.getElementById('suit-screen').classList.add('hidden');
            document.getElementById('rank-screen').classList.remove('hidden');
        }

// Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
        }
if (
            window.Telegram && 
            window.Telegram.WebApp.CloudStorage
        ) {
            window.Telegram.WebApp.CloudStorage.getItem(
                'player_energy', 
                function(err, value) {
                    if (!err && value !== null) {
    energy = parseInt(value, 10);
    if (isNaN(energy)) { energy = 3; }
document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/3`;
                        if (energy < 3) startEnergyTimer();
                    }
                }
            );
}
        
        generateSecretCard();
        let energyCooldown = 3600; // 60 минут в секундах
let timerInterval = null;

function startEnergyTimer() {
    if (timerInterval) return;

    timerInterval = setInterval(() => {
        if (energy >= 3) {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('energy-timer').innerText = "⏳ Энергия полная";
            return;
        }

        energyCooldown--;

        if (energyCooldown <= 0) {
            energy++;
            energyCooldown = 3600;
            
            if (typeof updateEnergyDisplay === "function") {
                updateEnergyDisplay();
            } else {
                document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/3`;
            }
        }

        let minutes = Math.floor(energyCooldown / 60);
        let seconds = energyCooldown % 60;
        if (seconds < 10) seconds = "0" + seconds;

        document.getElementById('energy-timer').innerText = `⏳ до +1: ${minutes}:${seconds}`;
    }, 1000);
}

// Запуск проверки при старте игры
if (energy < 3) {
    startEnergyTimer();
        }
    </script>
</body>
    </html>
