<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Clicker</title>
    <!-- Подключение AdsGram -->
    <script src="https://adsgram.ai"></script>
    
    <style>
        /* ВАШИ СТАРЫЕ СТИЛИ КЛИКЕРА */
        body {
            background-color: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .score-container {
            font-size: 48px;
            font-weight: bold;
            margin-top: 40px;
        }
        .text-label {
            color: #888;
            font-size: 16px;
        }
        #coin {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ffe066, #f5b041);
            border-radius: 50%;
            margin: 40px auto;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 176, 65, 0.6);
            transition: transform 0.1s;
        }
        #coin:active {
            transform: scale(0.95);
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.98);
        }

        /* НОВЫЕ СТИЛИ ДЛЯ МЕНЮ И ЭКРАНОВ */
        .app-screen {
            display: none; 
            width: 100%;
            box-sizing: border-box;
            padding-bottom: 90px;
        }
        .app-screen.active {
            display: block; 
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #151515;
            border-top: 1px solid #252525;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: #888888;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <main class="content">
        <!-- ЭКРАН 1: ИГРА (Ваш старый кликер теперь живет тут) -->
        <section id="screen-game" class="app-screen active">
            <div class="score-container" id="balance">0</div>
            <div class="text-label">Монет накоплено</div>
            
            <div id="coin" onclick="clickCoin()"></div>
            <br>
            <button class="btn" onclick="showAd()">Смотреть видео (+100 🟡)</button>
        </section>

        <!-- ЭКРАН 2: ТОП ИГРОКОВ (Заготовка) -->
        <section id="screen-leaderboard" class="app-screen">
            <h2 style="margin-top: 50px;">🏆 Топ игроков</h2>
            <p style="color: #888;">Раздел находится в разработке...</p>
        </section>

        <!-- ЭКРАН 3: КВЕСТЫ (Заготовка) -->
        <section id="screen-tasks" class="app-screen">
            <h2 style="margin-top: 50px;">🚀 Задания</h2>
            <p style="color: #888;">Раздел находится в разработке...</p>
        </section>

        <!-- ЭКРАН 4: ВЫВОД (Заготовка) -->
        <section id="screen-wallet" class="app-screen">
            <h2 style="margin-top: 50px;">💰 Вывод средств</h2>
            <p style="color: #888;">Раздел находится в разработке...</p>
        </section>
    </main>

    <!-- ПАНЕЛЬ КНОПОК МЕНЮ -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchScreen('screen-game', this)">🎮 Игра</button>
        <button class="nav-item" onclick="switchScreen('screen-leaderboard', this)">🏆 Топ</button>
        <button class="nav-item" onclick="switchScreen('screen-tasks', this)">🚀 Квесты</button>
        <button class="nav-item" onclick="switchScreen('screen-wallet', this)">💰 Вывод</button>
    </nav>

    <script>
        // ВАША СТАРАЯ ЛОГИКА ИГРЫ
        let score = localStorage.getItem('clicker_balance') ? parseInt(localStorage.getItem('clicker_balance')) : 0;
        document.getElementById('balance').innerText = score;

        function clickCoin() {
            score++;
            updateBalance();
        }

        function updateBalance() {
            document.getElementById('balance').innerText = score;
            localStorage.setItem('clicker_balance', score);
        }

        function showAd() {
            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: "41911" });
                AdController.show().then((result) => {
                    score += 100;
                    updateBalance();
                    alert("Успешно! Вам начислено 100 монет.");
                }).catch((result) => {
                    alert("Реклама не загрузилась или была закрыта раньше времени.");
                });
            } else {
                score += 100;
                updateBalance();
                alert("Ошибка: Сеть Adsgram недоступна.");
            }
        }

        // НОВАЯ ФУНКЦИЯ ДЛЯ ПЕРЕКЛЮЧЕНИЯ ВКЛАДОК МЕНЮ
        function switchScreen(screenId, buttonElement) {
            const screens = document.querySelectorAll('.app-screen');
            screens.forEach(screen => screen.classList.remove('active'));

            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));

            document.getElementById(screenId).classList.add('active');
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
