<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Adsgram Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-ad-controller.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9; color: #222; text-align: center; margin: 0; padding: 20px;
            user-select: none; -webkit-user-select: none;
        }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .score-container { font-size: 28px; font-weight: bold; margin: 20px 0; color: #0088cc; }
        .click-btn {
            width: 160px; height: 160px; border-radius: 50%; border: none; background: linear-gradient(135deg, #0088cc, #00aacc);
            color: white; font-size: 40px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,136,204,0.3); transition: transform 0.1s;
        }
        .click-btn:active { transform: scale(0.95); }
        .ad-btn {
            margin-top: 25px; width: 100%; padding: 12px; background-color: #4caf50; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .ad-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Adsgram Clicker</h2>
        <div class="score-container">Balance: <span id="score">0</span> I</div>
        <button class="click-btn" id="clickBtn">I</button>
        <button class="ad-btn" id="adBtn">I Watch Ad (+500 I)</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let score = parseInt(localStorage.getItem('clicker_score')) || 0;
        const scoreEl = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const adBtn = document.getElementById('adBtn');
        scoreEl.innerText = score;
        function updateScore(amount) {
 score += amount;
 scoreEl.innerText = score;
 localStorage.setItem('clicker_score', score);
 }
 clickBtn.addEventListener('click', () => updateScore(1));
 // Adsgram Integration Block
 // Replace 'YOUR_BLOCK_ID' with your actual Adsgram Block ID from the dashboard
 const AdController = window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" });
 adBtn.addEventListener('click', () => {
 adBtn.disabled = true;
 AdController.show()
 .then((result) => {
 // User successfully watched the video ad completely
 updateScore(500);
 tg.showAlert("Success! You received +500 coins.");
 })
 .catch((result) => {
 // Ad was skipped, blocked, or encountered an error
 if (result.error) {
 tg.showAlert("Ad error or filled completely. Try again later.");
 } else if (result.done === false) {
 tg.showAlert("You skipped the ad! No reward granted.");
 }
 })
 .finally(() => {
 adBtn.disabled = false;
 });
 });
 </script>
</body>
</html>
