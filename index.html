<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master of Intuition</title>
    <style>
        /* CSS — ЭТО СТИЛИ. ОНИ ОТВЕЧАЮТ ЗА КРАСОТУ И ЦВЕТА В ИГРЕ */
        
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #000000; /* ДЕЛАЕМ ЧЕРНЫЙ ФОН ДЛЯ ВСЕГО ЭКРАНА */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* КРАСИВАЯ СЕРЕНЬКАЯ РАМКА ДЛЯ ЭНЕРГИИ С ЗОЛОТЫМ СВЕЧЕНИЕМ */
        .header-panel {
            display: flex;
            flex-direction: column; /* СТАВИМ ТЕКСТ ДРУГ ПОД ДРУГОМ */
            align-items: center;
            justify-content: center;
            width: 60%; /* ДЕЛАЕМ ПАНЕЛЬ КОРОТКОЙ И АККУРАТНОЙ */
            max-width: 400px;
            background-color: #0d0d0d;
            padding: 14px 20px;
            border-radius: 16px;
            border: 2px solid #ffd700; /* КРАСИМ РАМКУ В ЗОЛОТОЙ ЦВЕТ */
            margin-top: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
        }

        /* ТЕКСТ СЛОВА ЭНЕРГИЯ */
        .energy-text {
            color: #ffd700;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
        }

        /* МАЛЕНЬКИЙ ЖЕЛТЫЙ ТЕКСТ ДЛЯ БУДУЩЕГО ТАЙМЕРА */
        .timer-text {
            font-size: 13px;
            color: #ffd700;
            margin-top: 5px;
            font-weight: bold;
            opacity: 0.9;
        }

        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        /* РУБАШКА НАШЕЙ ИГРОВОЙ КАРТЫ С ЗОЛОТЫМИ ПОЛОСКАМИ И КРЕСТИКАМИ */
        .card-shirt {
            width: 160px;
            height: 240px;
            background-color: #111111;
            border: 3px solid #ffd700; /* ЗОЛОТОЙ ОБОДОК КАРТЫ */
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 10px 30px rgba(255, 215, 0, 0.15);
            margin-bottom: 25px;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 10%, rgba(255,215,0,0.05) 11%, transparent 12%),
                linear-gradient(45deg, transparent 49%, #ffd700 49%, #ffd700 51%, transparent 52%),
                linear-gradient(-45deg, transparent 49%, #ffd700 49%, #ffd700 51%, transparent 52%);
            background-size: 20px 20px, 20px 20px, 20px 20px;
        }

        /* ЭФФЕКТ, КОГДА КАРТА ПЕРЕВЕРНУЛАСЬ ЛИЦОМ К НАМ */
        .card-shirt.flipped {
            background-color: #ffffff !important; /* ДЕЛАЕМ ЛИЦО КАРТЫ БЕЛЫМ */
            background-image: none !important;
            transform: rotateY(180deg); /* КРУТИМ КАРТУ НА 180 ГРАДУСОВ */
        }

        /* ЧТО НАХОДИТСЯ ВНУТРИ ОТКРЫТОЙ КАРТЫ */
        .card-front-content {
            font-size: 44px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotateY(180deg);
        }

        .magic-ball {
            font-size: 45px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        /* ЖЕЛТЫЙ ТЕКСТ С ВОПРОСОМ ДЛЯ ИГРОКА */
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #ffd700;
        }

        .screen-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        /* СЕТКИ, ЧТОБЫ КНОПКИ СТОЯЛИ РОВНЫМИ РЯДАМИ */
        .grid-ranks {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 КНОПКИ В ОДИН РЯД */
            gap: 12px;
            width: 100%;
        }

        .grid-suits {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 КНОПКИ В ОДИН РЯД */
            gap: 12px;
            width: 100%;
        }

        /* СТИЛЬ ДЛЯ ВСЕХ КНОПОК ИГРЫ */
        button {
            background-color: #0a0a0a;
            color: #ffd700; /* ЖЕЛТЫЕ БУКВЫ */
            border: 2px solid #ffd700; /* ЗОЛОТАЯ ГРАНИЦА КНОПКИ */
            padding: 15px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            -webkit-tap-highlight-color: transparent;
        }

        /* ЭФФЕКТ, КОГДА МЫ НАЖИМАЕМ ПАЛЬЦЕМ НА КНОПКУ */
        button:active {
            transform: scale(0.95); /* КНОПКА СЛЕГКА СЖИМАЕТСЯ О Т НАЖАТИЯ */
            background-color: #1a1a1a;
        }

        /* КНОПКА СТАНОВИТСЯ ТЕМНОЙ, ЕСЛИ НА НЕЕ НЕЛЬЗЯ НАЖАТЬ */
        button:disabled {
            border-color: #444444;
            color: #666666;
            background-color: #020202;
        }

        /* ЦВЕТА ДЛЯ КНОПОК С МАСТЯМИ */
        .suit-btn[data-color="red"] {
            color: #ff4d4d; /* КРАСНЫЙ ДЛЯ БУБЕЙ И ЧЕРВЕЙ */
            border-color: #ff4d4d;
        }

        .suit-btn[data-color="black"] {
            color: #ffffff; /* БЕЛЫЙ ДЛЯ ПИК И КРЕСТЕЙ */
            border-color: #ffffff;
        }

        /* КРАСИВАЯ СВЕТЯЩАЯСЯ КНОПКА ДЛЯ ВИДЕОРОЛИКА */
        .video-btn {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(135deg, #ffd700, #b3a60b);
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            margin-bottom: 35px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            animation: pulseAd 1.5s infinite; /* КНОПКА МЯГКО ПУЛЬСИРУЕТ */
        }

        @keyframes pulseAd {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .hidden {
            display: none !important; /* УБИРАЕТ С ЭКРАНА СЛОВА И КНОПКИ, КОГДА ОНИ НЕ НУЖНЫ */
        }
    </style>
</head>
<body>

    <!-- HTML — ЭТО КАРКАС ИГРЫ. ОН РАССТАВЛЯЕТ ВСЕ КНОПКИ И ТЕКСТ НА ЭКРАНЕ -->

    <!-- ВЕРХНЯЯ ПАНЕЛЬКА (ОЧКИ ПОЛНОСТЬЮ СТЁРТЫ) -->
    <div class="header-panel">
        <div class="energy-text" id="energy-display">ЭНЕРГИЯ: 3/3</div>
        <div class="timer-text" id="energy-timer">⏳ Энергия полная</div>
    </div>

    <div class="game-zone">
        <!-- НАША ИГРАЛЬНАЯ КАРТА, КОТОРУЮ НАДО УГАДАТЬ -->
        <div class="card-shirt" id="main-game-card">
            <div class="magic-ball" id="card-icon">🔮</div>
        </div>

        <!-- ТЕКСТ ПОДСКАЗКИ, КОТОРЫЙ ГОВОРИТ ЧТО ДЕЛАТЬ ИГРОКУ -->
        <div class="question-text" id="instruction-title">Какое достоинство у карты?</div>

        <!-- ЭКРАН №1: ТУТ ИГРОК ВЫБИРАЕТ ЦИФРУ КАРТЫ (ОТ 6 ДО ТУЗА) -->
        <div id="rank-screen" class="screen-container">
            <div class="grid-ranks">
                <button onclick="chooseRank('6')">6</button>
                <button onclick="chooseRank('7')">7</button>
                <button onclick="chooseRank('8')">8</button>
                <button onclick="chooseRank('9')">9</button>
                <button onclick="chooseRank('10')">10</button>
                <button onclick="chooseRank('J')">J</button>
                <button onclick="chooseRank('Q')">Q</button>
                <button onclick="chooseRank('K')">K</button>
                <button onclick="chooseRank('A')">A</button>
            </div>
        </div>

        <!-- ЭКРАН №2: ТУТ ИГРОК ВЫБИРАЕТ МАСТЬ (ИЗНАЧАЛЬНО ОН СКРЫТ) -->
        <div id="suit-screen" class="screen-container hidden">
            <div class="grid-suits">
                <button class="suit-btn" data-color="black" onclick="chooseSuit('♠')">♠ Пики</button>
                <button class="suit-btn" data-color="black" onclick="chooseSuit('♣')">♣ Крести</button>
                <button class="suit-btn" data-color="red" onclick="chooseSuit('♦')">♦ Буби</button>
                <button class="suit-btn" data-color="red" onclick="chooseSuit('♥')">♥ Черви</button>
            </div>
        </div>

        <!-- КНОПКА ДЛЯ ПОДЗАРЯДКИ ЭНЕРГИИ ЧЕРЕЗ ВИДЕО (ТОЖЕ СКРЫТА, ПОКА ЕСТЬ ПОПЫТКИ) -->
        <button id="video-button" class="video-btn hidden" onclick="watchVideoAd()">🎬 Посмотреть видео (+3 Энергии)</button>
    </div>

    <!-- ПОДКЛЮЧАЕМ СИСТЕМЫ ИГРЫ ТЕЛЕГРАМА И РЕКЛАМЫ (ВАШИ СТАРЫЕ ССЫЛКИ, КОТОРЫЕ МЫ НЕ ТРОГАЕМ) -->
    <script src="https://sad.adsgram.live/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- JAVASCRIPT — ЭТО МОЗГ НАШЕЙ ИГРЫ. ОН ЗАСТАВЛЯЕТ ВСЁ ДУМАТЬ И НАЖИМАТЬСЯ -->
<script>
    // ВКЛЮЧАЕМ СИСТЕМУ ТЕЛЕГРАМА НА СМАРТФОНЕ ИГРОКА
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
    }

    // СЛОВАРЬ КАРТ И МАСТЕЙ ДЛЯ КОМПЬЮТЕРА
    const ranks = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
    const suits = ['♠', '♣', '♦', '♥'];

    // ВАЖНЫЕ НАСТРОЙКИ: СКОЛЬКО У ИГРОКА ЭНЕРГИИ ПРЯМО СЕЙЧАС
    let energy = 3;
    const maxEnergy = 3;
    let selectedRank = null;
    let secretCard = null;
    let isAnimating = false; // ПРОВЕРКА: КРУТИТСЯ ЛИ КАРТА СЕЙЧАС

    // ПЕРЕМЕННЫЕ ДЛЯ БУДУЩЕГО ТАЙМЕРА (ПАКЕТ СЕКУНД)
    let energyCooldown = 3600; 
    let timerInterval = null;

    // ВАШ ОРИГИНАЛЬНЫЙ КОД ДЛЯ РЕКЛАМЫ ADSGRAM
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;

    // КОМПЬЮТЕР ДУМАЕТ И ПРЯЧЕТ СЛУЧАЙНУЮ КАРТУ
    function generateSecretCard() {
        const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
        const randomSuit = suits[Math.floor(Math.random() * suits.length)];
        secretCard = { rank: randomRank, suit: randomSuit };
        console.log(`[Инструкция] Загаданная карта: ${secretCard.rank}${secretCard.suit}`);
    }

    // КОД СРАБАТЫВАЕТ, КОГДА ИГРОК НАЖИМАЕТ НА ЦИФРУ (НАПРИМЕР ТУЗ)
    function chooseRank(rank) {
        if (isAnimating) return; // ЕСЛИ ИДЕТ АНИМАЦИЯ — КНОПКИ ЗАБЛОКИРОВАНЫ
        
        if (energy <= 0) {
            checkEnergyStatus();
            return;
        }

        selectedRank = rank;
        document.getElementById('instruction-title').innerText = `Выбрано: ${rank}. Какая масть?`;
        document.getElementById('rank-screen').classList.add('hidden'); // ПРЯЧЕМ ЭКРАН ЦИФР
        document.getElementById('suit-screen').classList.remove('hidden'); // ПОКАЗЫВАЕМ ЭКРАН МАСТЕЙ
    }
    // КОД СРАБАТЫВАЕТ, КОГДА ИГРОК ВЫБРАЛ МАСТЬ — ИДЕТ ПРОВЕРКА КАРТЫ
    function chooseSuit(suit) {
        if (isAnimating) return;

        if (energy <= 0) {
            checkEnergyStatus();
            return;
        }

        isAnimating = true;
        updateLocalEnergy(energy - 1); // МИНУС 1 ЭНЕРГИЯ И СРАЗУ ЗАПИСЫВАЕМ В ПАМЯТЬ ТЕЛЕФОНА

        const cardElement = document.getElementById('main-game-card');
        const isRed = secretCard.suit === '♦' || secretCard.suit === '♥';
        const cardColor = isRed ? '#ff4d4d' : '#000000'; // КРАСИМ ЗНАЧКИ В КРАСНЫЙ ИЛИ ЧЕРНЫЙ ЦВЕТ

        if (cardElement) {
            cardElement.innerHTML = `
                <div class="card-front-content" style="color: ${cardColor}">
                    <div>${secretCard.suit}</div>
                    <div style="font-size: 55px; margin-top: -5px;">${secretCard.rank}</div>
                </div>
            `;
            cardElement.classList.add('flipped'); // КРУТИМ КАРТУ
        }

        // КОД УГАДАЛ ИЛИ НЕТ (КОД ОЧКОВ ПОЛНОСТЬЮ СТЁРТ ОТСЮДА!)
        if (selectedRank === secretCard.rank && suit === secretCard.suit) {
            document.getElementById('instruction-title').innerText = "🎉 Блестяще! Вы угадали карту!";
            setTimeout(resetToFirstScreen, 3000); // ПЕРЕЗАПУСК ЧЕРЕЗ 3 СЕКУНДЫ
        } else {
            document.getElementById('instruction-title').innerText = "Мимо! Развивайте шестое чувство";
            setTimeout(() => {
                checkEnergyStatus();
                resetToFirstScreen(); // ПЕРЕЗАПУСК ЧЕРЕЗ 3 СЕКУНДЫ
            }, 3000);
        }

        document.getElementById('suit-screen').classList.add('hidden');
    }

    // ТУТ МЫ ЧИТАЕМ ЭНЕРГИЮ ИЗ ТЕЛЕФОНА, ЧТОБЫ ОНА НЕ ИСЧЕЗАЛА ПРИ ОБНОВЛЕНИИ ЭКРАНА
    function initGameEnergy() {
        let savedEnergy = localStorage.getItem('local_energy');
        if (savedEnergy !== null) {
            energy = parseInt(savedEnergy, 10);
            if (isNaN(energy)) energy = 3;
        } else {
            energy = 3;
        }

        document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/3`;

        if (energy < 3) {
            startEnergyTimer();
            let savedTime = localStorage.getItem('local_cooldown');
            if (savedTime) energyCooldown = parseInt(savedTime, 10) || 3600;
        } else {
            document.getElementById('energy-timer').innerText = "⏳ Энергия полная";
            document.getElementById('video-button').classList.add('hidden');
        }
    }

    function updateLocalEnergy(value) {
        energy = value;
        localStorage.setItem('local_energy', energy.toString()); // СОХРАНЯЕМ В БРАУЗЕР НА СМАРТФОНЕ
        document.getElementById('energy-display').innerText = `ЭНЕРГИЯ: ${energy}/3`;
        
        if (window.Telegram && window.Telegram.WebApp.CloudStorage) {
            window.Telegram.WebApp.CloudStorage.setItem('player_energy', energy.toString()); // И В ТЕЛЕГРАМ СИНХРОНИЗИРУЕМ
        }
    }

    function checkEnergyStatus() {
        if (energy < 3) {
            startEnergyTimer();
        }
        if (energy <= 0) {
            document.getElementById('instruction-title').innerText = "Энергия закончилась. Посмотрите видео!";
            document.getElementById('video-button').classList.remove('hidden');
            document.getElementById('video-button').disabled = false;
        }
    }

    function resetToFirstScreen() {
        isAnimating = false;
        selectedRank = null;

        const cardElement = document.getElementById('main-game-card');
        if (cardElement) {
            cardElement.classList.remove('flipped');
            cardElement.innerHTML = `<div class="magic-ball" id="card-icon">🔮</div>`;
        }

        if (energy > 0) {
            document.getElementById('rank-screen').classList.remove('hidden');
            document.getElementById('instruction-title').innerText = "Какое достоинство у карты?";
        }
        generateSecretCard();
    }

    // ТАЙМЕР: ОН ТИКАЕТ КАЖДУЮ СЕКУНДУ САМ ПО СЕБЕ И ДОБАВЛЯЕТ ЭНЕРГИЮ
    function startEnergyTimer() {
        if (timerInterval) return;

        timerInterval = setInterval(() => {
            if (energy >= maxEnergy) {
                clearInterval(timerInterval);
                timerInterval = null;
                document.getElementById('energy-timer').innerText = "⏳ Энергия полная";
                return;
            }

            energyCooldown--;
            localStorage.setItem('local_cooldown', energyCooldown.toString());

            if (energyCooldown <= 0) {
                updateLocalEnergy(energy + 1); // +1 ЭНЕРГИЯ ИГРОКУ САМА ПО СЕБЕ!
                energyCooldown = 3600; // СБРОС СНОВА НА СЛЕДУЮЩИЙ ЧАС
                
                if (energy >= maxEnergy) {
                    document.getElementById('video-button').classList.add('hidden');
                }
            }

            let minutes = Math.floor(energyCooldown / 60);
            let seconds = energyCooldown % 60;
            if (seconds < 10) seconds = "0" + seconds;

            document.getElementById('energy-timer').innerText = `⏳ до +1: ${minutes}:${seconds}`;
        }, 1000);
    }

    // СТРОГИЙ КОД РЕКЛАМЫ ADSGRAM (ЕСЛИ ИГРОК ЗАКРЫЛ — ЭНЕРГИЮ НЕ ДАЕМ, МОДЕРАЦИЯ ОДОБРИТ!)
    function watchVideoAd() {
        const videoBtn = document.getElementById('video-button');
        if (videoBtn) videoBtn.disabled = true;
        
        document.getElementById('instruction-title').innerText = "Загрузка рекламы...";
        
        if (AdController && AdController.blockId === '43482') {
            AdController.show()
                .then(() => {
                    rewardUser(); // УСПЕХ: НАЧИСЛЯЕМ ПОЛНУЮ ЭНЕРГИЮ
                })
                .catch((error) => {
                    console.error("Adsgram Error:", error);
                    document.getElementById('instruction-title').innerText = "❌ Видео не досмотрено";
                    setTimeout(() => {
                        if (videoBtn) videoBtn.disabled = false;
                        document.getElementById('instruction-title').innerText = "Энергия закончилась. Посмотрите видео!";
                    }, 3000);
                });
        } else {
            // ТЕСТОВЫЙ ИНСТРУМЕНТ (САМ ДАЕТ НАГРАДУ ЗА 2 СЕКУНДЫ, ПОКА СТОИТ ТЕСТОВЫЙ ID БЛОКА)
            setTimeout(rewardUser, 2000);
        }
    }

    function rewardUser() {
        const videoBtn = document.getElementById('video-button');
        
        updateLocalEnergy(3); // СРАЗУ СТАВИМ ПОЛНЫЙ ЛИМИТ В ПАМЯТЬ ТЕЛЕФОНА
        energyCooldown = 3600;
        localStorage.setItem('local_cooldown', '3600');
        
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        
        document.getElementById('energy-timer').innerText = "⏳ Энергия полная";
        if (videoBtn) videoBtn.classList.add('hidden');
        
        resetToFirstScreen();
    }

    // ВКЛЮЧАЕМ ИГРУ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
    initGameEnergy();
    generateSecretCard();
</script>
</body>
</html>
