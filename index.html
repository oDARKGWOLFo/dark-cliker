<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master of Intuition</title>
    <style>
        /* Базовые настройки под стиль Telegram Mini App */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #145c32; /* Темно-зеленый суконный фон из скриншота */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Верхняя панель состояния (Очки и Энергия) */
        .header-panel {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 400px;
            background-color: #0b361d;
            padding: 12px 20px;
            border-radius: 15px;
            margin-top: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .score-text {
            color: #ffd700; /* Золотой цвет для очков */
            font-weight: bold;
            font-size: 16px;
        }

        .energy-text {
            color: #00e5ff; /* Бирюзовый цвет для энергии */
            font-weight: bold;
            font-size: 16px;
        }

        /* Центральная игровая зона */
        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Закругленная рубашка карты по центру */
        .card-shirt {
            width: 160px;
            height: 240px;
            background-color: #196f3d;
            border: 3px solid #ffffff;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 25px;
            position: relative;
            background-image: radial-gradient(#1e8449 15%, transparent 16%),
                              radial-gradient(#1e8449 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
        }

        /* Магический шар из вашего примера */
        .magic-ball {
            font-size: 45px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Интерактивный текст вопроса */
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Общие контейнеры для блоков кнопок */
        .screen-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Удобная сетка 3х3 для выбора достоинства карты */
        .grid-ranks {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        /* Сетка 2х2 для выбора масти */
        .grid-suits {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        /* Единый стиль игровых кнопок */
        button {
            background-color: #212f3d;
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        /* Эффект нажатия кнопок для мобильных экранов */
        button:active {
            transform: scale(0.95);
            background-color: #2c3e50;
        }

        /* Цветовое разделение кнопок мастей */
        .suit-btn[data-color="red"] {
            background-color: #b03a2e; /* Красный цвет для Буби/Черви */
        }
        .suit-btn[data-color="red"]:active {
            background-color: #cb4335;
        }

        .suit-btn[data-color="black"] {
            background-color: #2c3e50; /* Темный цвет для Пики/Крести */
        }
        .suit-btn[data-color="black"]:active {
            background-color: #34495e;
        }

        /* Вспомогательный класс для плавного переключения экранов */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Шапка с игровыми данными -->
    <div class="header-panel">
        <div class="score-text" id="score-display">Очки: 0</div>
        <div class="energy-text" id="energy-display">Энергия: 3/3</div>
    </div>

    <!-- Игровой стол -->
    <div class="game-zone">
        <div class="card-shirt">
            <div class="magic-ball">🔮</div>
        </div>
        
        <div class="question-text" id="instruction-title">Какое достоинство у карты?</div>

        <!-- ШАГ 1: Меню выбора достоинства (6-Туз) -->
        <div id="rank-screen" class="screen-container">
            <div class="grid-ranks">
                <button onclick="chooseRank('6')">6</button>
                <button onclick="chooseRank('7')">7</button>
                <button onclick="chooseRank('8')">8</button>
                <button onclick="chooseRank('9')">9</button>
                <button onclick="chooseRank('10')">10</button>
                <button onclick="chooseRank('J')">Валет (J)</button>
                <button onclick="chooseRank('Q')">Дама (Q)</button>
                <button onclick="chooseRank('K')">Король (K)</button>
                <button onclick="chooseRank('A')">Туз (A)</button>
            </div>
        </div>

        <!-- ШАГ 2: Меню выбора масти (изначально скрыто) -->
        <div id="suit-screen" class="screen-container hidden">
            <div class="grid-suits">
                <button class="suit-btn" data-color="black" onclick="chooseSuit('♠')">Пики ♠</button>
                <button class="suit-btn" data-color="black" onclick="chooseSuit('♣')">Крести ♣</button>
                <button class="suit-btn" data-color="red" onclick="chooseSuit('♦')">Буби ♦</button>
                <button class="suit-btn" data-color="red" onclick="chooseSuit('♥')">Черви ♥</button>
            </div>
        </div>
    </div>

    <!-- Сюда во второй части мы вставим тег <script> с логикой -->
<script>
        // Переменные для хранения карт, очков и лимитов
        const ranks = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
        const suits = ['♠', '♣', '♦', '♥'];

        let score = 0;
        let energy = 3;
        const maxEnergy = 3;

        let selectedRank = null; // Переменная для записи выбранного номинала
        let secretCard = null;   // Переменная для хранения загаданной карты

        // 1. Функция создания новой случайной карты
        function generateSecretCard() {
            const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
            const randomSuit = suits[Math.floor(Math.random() * suits.length)];
            secretCard = { rank: randomRank, suit: randomSuit };
            
            // Подсказка в консоли браузера (F12) для проверки работы
            console.log(`[Интуиция]: Загаданная карта — ${secretCard.rank}${secretCard.suit}`);
        }

        // 2. Шаг первый: Обработка клика на номинал карты (6-Туз)
        function chooseRank(rank) {
            selectedRank = rank;
            
            // Меняем текст вопроса на экране
            document.getElementById('instruction-title').innerText = `Выбрано: ${rank}. Какая масть?`;
            
            // Прячем экран выбора номиналов и показываем выбор мастей
            document.getElementById('rank-screen').classList.add('hidden');
            document.getElementById('suit-screen').classList.remove('hidden');
        }

        // 3. Шаг второй: Обработка клика на масть и финальная проверка
        function chooseSuit(suit) {
            // Проверка на наличие доступной энергии
            if (energy <= 0) {
                alert("Энергия на нуле! Перезагрузите страницу или подождите.");
                resetToFirstScreen();
                return;
            }

            // Уменьшаем запас энергии на 1 единицу
            energy--;
            document.getElementById('energy-display').innerText = `Энергия: ${energy}/${maxEnergy}`;

            // Сверяем выбор пользователя с загаданной картой
            if (selectedRank === secretCard.rank && suit === secretCard.suit) {
                // Игрок угадал и номинал, и масть (шанс 1 из 36!)
                score += 100; 
                document.getElementById('score-display').innerText = `Очки: ${score}`;
                alert(`🔮 Феноменально! Интуиция вас не подвела. Это была карта: ${secretCard.rank}${secretCard.suit}. Получено +100 очков!`);
            } else {
                // Игрок не угадал
                alert(`Мимо. Загаданная карта была: ${secretCard.rank}${secretCard.suit}. Попробуйте развить интуицию еще раз!`);
            }

            // Запускаем новый раунд игры
            generateSecretCard();
            resetToFirstScreen();
        }

        // 4. Функция возврата к первому экрану выбора достоинства
        function resetToFirstScreen() {
            selectedRank = null;
            document.getElementById('instruction-title').innerText = "Какое достоинство у карты?";
            document.getElementById('suit-screen').classList.add('hidden');
            document.getElementById('rank-screen').classList.remove('hidden');
        }

        // Автоматический запуск генерации карты при первом открытии
        generateSecretCard();
</script>
    
</body>    
</html>
